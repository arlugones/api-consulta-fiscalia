[project]
name = "api-consulta-fiscalia"
version = "0.1.0"
description = "API wrapper para la consulta de noticias del delito de la Fiscalía General del Estado del Ecuador"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.28.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",
]

[project.scripts]
api-consulta-fiscalia = "main:main"
